<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Tracker">
<title>Time Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }

  .topbar { background: #fff; border-bottom: 0.5px solid #e0e0d8; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .topbar h1 { font-size: 17px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .sync-indicator { font-size: 12px; color: #888; display: flex; align-items: center; gap: 4px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf50; }
  .sync-dot.syncing { background: #ff9800; animation: pulse 1s infinite; }
  .sync-dot.error { background: #f44336; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .content { padding: 16px; max-width: 480px; margin: 0 auto; }

  .activity-card { background: #fff; border-radius: 14px; border: 0.5px solid #e0e0d8; padding: 16px; margin-bottom: 12px; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-total { font-size: 13px; color: #666; margin-top: 2px; }
  .delete-btn { background: none; border: none; color: #ccc; font-size: 20px; cursor: pointer; padding: 0 0 0 8px; line-height: 1; }
  .delete-btn:active { color: #f44336; }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .time-btn { padding: 11px 4px; font-size: 14px; font-weight: 500; border: 0.5px solid #e0e0d8; border-radius: 10px; background: #f9f9f6; color: #1a1a1a; cursor: pointer; text-align: center; transition: background 0.1s, transform 0.1s; }
  .time-btn:active { background: #e8f5e9; transform: scale(0.96); border-color: #a5d6a7; }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #222; color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 20px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .add-section { margin-top: 4px; }
  .add-row { display: flex; gap: 8px; }
  .add-input { flex: 1; padding: 12px 14px; font-size: 15px; border: 0.5px solid #e0e0d8; border-radius: 12px; background: #fff; outline: none; }
  .add-input:focus { border-color: #1D9E75; }
  .add-btn { padding: 12px 18px; font-size: 15px; font-weight: 500; border: none; border-radius: 12px; background: #1D9E75; color: #fff; cursor: pointer; white-space: nowrap; }
  .add-btn:active { background: #0F6E56; }
  .add-btn:disabled { background: #ccc; cursor: default; }

  .empty-state { text-align: center; padding: 40px 20px; color: #999; }
  .empty-state svg { margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 15px; }

  .setup-banner { background: #fff8e1; border: 0.5px solid #ffe082; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: #5d4037; line-height: 1.6; }
  .setup-banner strong { font-weight: 600; }
  .setup-url { display: flex; gap: 8px; margin-top: 10px; }
  .setup-url input { flex: 1; padding: 8px 12px; font-size: 13px; border: 0.5px solid #e0e0d8; border-radius: 8px; background: #fff; outline: none; }
  .setup-url button { padding: 8px 14px; font-size: 13px; font-weight: 500; border: none; border-radius: 8px; background: #1D9E75; color: #fff; cursor: pointer; }

  .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .spinner { width: 32px; height: 32px; border: 3px solid #e0e0d8; border-top-color: #1D9E75; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fab { position: fixed; bottom: 24px; right: 20px; width: 52px; height: 52px; border-radius: 50%; background: #1D9E75; color: #fff; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
</style>
</head>
<body>

<div class="topbar">
  <h1>⏱ Time Tracker</h1>
  <div class="topbar-right">
    <div class="sync-indicator">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">Sheets</span>
    </div>
  </div>
</div>

<div class="content">
  <div class="setup-banner" id="setupBanner">
    <strong>Configuration requise</strong><br>
    Colle l'URL de ton Google Apps Script déployé ci-dessous. Si tu ne l'as pas encore, suis les instructions fournies avec cette app.
    <div class="setup-url">
      <input type="url" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/..." />
      <button onclick="saveScriptUrl()">Sauver</button>
    </div>
  </div>

  <div id="activitiesList"></div>

  <div class="add-section" id="addSection" style="display:none">
    <div class="add-row">
      <input class="add-input" id="newActivityName" type="text" placeholder="Nom de l'activité..." maxlength="40" />
      <button class="add-btn" id="addBtn" onclick="addActivity()">Ajouter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "timetracker_script_url";
let SCRIPT_URL = localStorage.getItem(STORAGE_KEY) || "";
let activities = [];
let totals = {};

function saveScriptUrl() {
  const val = document.getElementById("scriptUrlInput").value.trim();
  if (!val.startsWith("https://script.google.com")) {
    showToast("URL invalide");
    return;
  }
  SCRIPT_URL = val;
  localStorage.setItem(STORAGE_KEY, val);
  document.getElementById("setupBanner").style.display = "none";
  document.getElementById("addSection").style.display = "block";
  loadAll();
}

function setSyncing(state) {
  const dot = document.getElementById("syncDot");
  const label = document.getElementById("syncLabel");
  dot.className = "sync-dot" + (state === "syncing" ? " syncing" : state === "error" ? " error" : "");
  label.textContent = state === "syncing" ? "Sync..." : state === "error" ? "Erreur" : "Sheets";
}

async function api(params) {
  setSyncing("syncing");
  const url = SCRIPT_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) { setSyncing("error"); throw new Error(data.error); }
  setSyncing("ok");
  return data;
}

async function loadAll() {
  if (!SCRIPT_URL) return;
  try {
    const [actData, totData] = await Promise.all([
      api({ action: "getActivities" }),
      api({ action: "getTotals" })
    ]);
    activities = actData.activities || [];
    totals = totData.totals || {};
    render();
  } catch(e) {
    showToast("Erreur de connexion");
  }
}

function formatTotal(h) {
  const totalMin = Math.round(h * 60);
  const hh = Math.floor(totalMin / 60);
  const mm = totalMin % 60;
  if (hh === 0) return mm + " min";
  if (mm === 0) return hh + "h";
  return hh + "h " + mm + "min";
}

function render() {
  const list = document.getElementById("activitiesList");
  if (activities.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <p>Aucune activité encore.<br>Ajoute-en une ci-dessous !</p>
    </div>`;
    return;
  }
  list.innerHTML = activities.map(name => {
    const total = totals[name] || 0;
    return `<div class="activity-card" id="card-${CSS.escape(name)}">
      <div class="card-header">
        <div>
          <div class="card-title">${escHtml(name)}</div>
          <div class="card-total" id="total-${CSS.escape(name)}">Total : <strong>${formatTotal(total)}</strong></div>
        </div>
        <button class="delete-btn" onclick="deleteActivity('${escJs(name)}')" title="Supprimer">×</button>
      </div>
      <div class="btn-row">
        <button class="time-btn" onclick="logTime('${escJs(name)}', 0.25)">+15 min</button>
        <button class="time-btn" onclick="logTime('${escJs(name)}', 0.5)">+30 min</button>
        <button class="time-btn" onclick="logTime('${escJs(name)}', 1)">+1 h</button>
      </div>
    </div>`;
  }).join("");
}

async function logTime(name, hours) {
  showToast("Enregistrement...");
  try {
    const data = await api({ action: "logTime", activity: name, hours });
    totals[name] = data.total;
    const el = document.getElementById("total-" + CSS.escape(name));
    if (el) el.innerHTML = "Total : <strong>" + formatTotal(data.total) + "</strong>";
    const label = hours === 1 ? "1h" : hours === 0.5 ? "30 min" : "15 min";
    showToast("+" + label + " ajouté ✓");
  } catch(e) {
    showToast("Erreur d'enregistrement");
  }
}

async function addActivity() {
  const input = document.getElementById("newActivityName");
  const name = input.value.trim();
  if (!name) return;
  document.getElementById("addBtn").disabled = true;
  try {
    await api({ action: "addActivity", name });
    input.value = "";
    showToast("Activité créée ✓");
    loadAll();
  } catch(e) {
    showToast("Erreur : " + e.message);
  }
  document.getElementById("addBtn").disabled = false;
}

async function deleteActivity(name) {
  if (!confirm("Supprimer \"" + name + "\" de la liste ? (Les données dans Sheets sont conservées)")) return;
  try {
    await api({ action: "deleteActivity", name });
    showToast("Supprimé");
    loadAll();
  } catch(e) {
    showToast("Erreur");
  }
}

document.getElementById("newActivityName").addEventListener("keydown", e => {
  if (e.key === "Enter") addActivity();
});

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function escJs(s) { return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

if (SCRIPT_URL) {
  document.getElementById("setupBanner").style.display = "none";
  document.getElementById("scriptUrlInput").value = SCRIPT_URL;
  document.getElementById("addSection").style.display = "block";
  loadAll();
}
</script>
</body>
</html>
